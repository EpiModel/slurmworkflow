url: https://epimodel.github.io/slurmworkflow/
template:
  bootstrap: 5

reference:
- title: "Workflow creation"
  desc: >
    Create, extend, and reload workflow designs.
  contents:
  - create_workflow
  - add_workflow_step
  - load_workflow

- title: "Step templates"
  desc: >
    Define what each workflow step runs.
  contents:
  - starts_with("step_tmpl")

- title: "Running workflow context"
  desc: >
    Query the current run and its resolved submission.
  contents:
  - get_workflow_root
  - get_current_workflow_step
  - get_current_workflow_step_name
  - get_workflow_submission

- title: "Dynamic execution"
  desc: >
    Create one-shot successor and submission changes. These low-level controls
    can skip work or create loops and require careful use.
  contents:
  - change_next_workflow_step
  - override_workflow_step
  - set_map_size

- title: "Utilities for custom step templates"
  desc: >
    Helpers for templates and instruction scripts.
  contents:
  - helper_use_setup_lines
  - helper_write_instructions
