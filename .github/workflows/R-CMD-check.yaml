# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  # The bash engine suite, without R, on the runner's bash and with
  # BASH_COMPAT=4.2.
  engine:
    runs-on: ubuntu-latest
    name: engine (bash suite)
    steps:
      - uses: actions/checkout@v4
      - name: Engine suite
        run: bash tests/runtime/test-engine.sh
      - name: Engine suite, BASH_COMPAT=4.2
        run: BASH_COMPAT=4.2 bash tests/runtime/test-engine.sh

  # The same suite on a real bash 4.2. GNU tools are installed so that the
  # image matches a cluster, not busybox.
  engine-bash42:
    runs-on: ubuntu-latest
    name: engine (real bash 4.2)
    steps:
      - uses: actions/checkout@v4
      - name: Engine suite on bash 4.2
        run: |
          docker run --rm -v "$PWD:/work" -w /work bash:4.2 bash -c '
            apk add --no-cache coreutils procps findutils grep sed gawk util-linux >/dev/null &&
            bash --version | head -n 1 &&
            bash tests/runtime/test-engine.sh'
